[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyweight"
dynamic = ["version"]
description = "Analyze Python import graphs to detect and fix import bloat"
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
keywords = ["python", "imports", "dependency-analysis", "performance", "bloat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.24.1",
]

[project.optional-dependencies]
analysis = [
    "networkx>=3.6.1",
]

[project.scripts]
pyweight = "pyweight.cli:app"

[tool.hatch.version]
path = "pyweight/__init__.py"

[dependency-groups]
dev = [
    "hypothesis>=6.152.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    {include-group = "test"},
]
test = [
    "pyweight[analysis]",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--cov=pyweight --cov-branch --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF", "PIE", "PT", "RSE", "C4", "ISC"]

[tool.ruff.lint.per-file-ignores]
"pyweight/cli.py" = ["B008"]
# HTML/CSS/JS embedded in string templates naturally exceeds Python line-length limits
"pyweight/visualize.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
